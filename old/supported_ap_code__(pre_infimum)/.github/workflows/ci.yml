name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared rust-version must keep building, and edition 2024
        # requires 1.85, so that is the floor rather than an arbitrary MSRV.
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: build, default features
        run: cargo build --all-targets
      - name: test, default features
        run: cargo test --all-targets
      - name: build, parallel feature
        run: cargo build --all-targets --features parallel
      - name: test, parallel feature
        run: cargo test --all-targets --features parallel
      - name: doc tests
        run: cargo test --doc --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - name: docs build without warnings
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
