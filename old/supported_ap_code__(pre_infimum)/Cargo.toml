[package]
name = "supported-ap"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Prior-standardized average precision and supported chance-normalized predictive performance"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/supported-ap"
keywords = ["statistics", "metrics", "average-precision", "bootstrap", "permutation"]
categories = ["science", "mathematics"]
exclude = [
    ".github/**",
    "domain_study/data/**",
    "domain_study/outputs/**",
]

[workspace]

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
rand = { version = "0.8.5", default-features = false, features = ["std"] }
rand_chacha = { version = "0.3.1", default-features = false }
rayon = { version = "1.11.0", optional = true }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "throughput"
harness = false
