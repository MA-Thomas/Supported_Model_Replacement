[workspace]

[package]
name = "immunogenicity_evaluation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "assemble_tensor"
path = "src/bin/assemble_tensor.rs"

[[bin]]
name = "grid_search_auc"
path = "src/bin/grid_search_auc.rs"

[dependencies]
# CSV parsing
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Parallelism
rayon = "1.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Data structures
rustc-hash = "2.0"
indexmap = "2.2"

# Parquet output for efficient tensor storage
arrow = { version = "53", features = ["prettyprint"] }
parquet = { version = "53", features = ["arrow"] }

# Progress bars
indicatif = "0.17"

# Glob for file matching
glob = "0.3"

# Ordered floats for hashing
ordered-float = "4.2"

# JSON serialization for metadata
serde_json = "1.0"
