[package]
name = "supported-ap"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "V17 staged finite-evidence challenges for supported AP and AUROC"
license = "MIT"
readme = "README.md"

[workspace]
members = [".", "crates/directed_round_robin_organizer"]
resolver = "3"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
highs-reference = ["dep:highs"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
highs = { version = "2.4", optional = true }
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = { version = "1.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "supported_ap"
path = "src/bin/supported_ap.rs"
