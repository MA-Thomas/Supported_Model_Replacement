[package]
name = "iris_fullroster_pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust-native IRIS full-roster transfer and tournament bundle pipeline"
license = "MIT"

[dependencies]
anyhow = "1"
arrow = { version = "53", features = ["prettyprint"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
directed_round_robin_organizer = { path = "../directed_round_robin_organizer" }
external_validation_inputs = { path = "../external_validation_inputs" }
parquet = { version = "53", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
supported-ap = { path = "../.." }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "iris_fullroster_pipeline"
path = "src/lib.rs"

[[bin]]
name = "iris_fullroster_pipeline"
path = "src/main.rs"
