[package]
name = "directed_round_robin_organizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic orchestration and verdict-only reduction of supported-ap tournaments"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
supported-ap = { path = "../..", features = ["parallel"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "directed_round_robin_organizer"
path = "src/lib.rs"

[[bin]]
name = "directed_round_robin_organizer"
path = "src/main.rs"
