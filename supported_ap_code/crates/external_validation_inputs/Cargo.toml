[package]
name = "external_validation_inputs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic full-roster external-validation input builder for IRIS"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "external_validation_inputs"
path = "src/lib.rs"

[[bin]]
name = "external_validation_inputs"
path = "src/main.rs"
